<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171311" />
    <title>Palermo Streets — Stage Editor</title>
    <link rel="stylesheet" href="/src/tools/stageEditor.css" />
  </head>
  <body>
    <div id="editor-app">
      <header class="toolbar">
        <div class="brand"><span>PALERMO STREETS</span><strong>STAGE EDITOR</strong></div>
        <label>Modulo <select id="module-select" aria-label="Modulo"></select></label>
        <button id="undo" type="button" title="Ctrl+Z">Annulla</button>
        <button id="redo" type="button" title="Ctrl+Shift+Z">Ripeti</button>
        <button id="toggle-guides" type="button" class="active">Guide</button>
        <button id="preview-game" type="button">Vista gioco</button>
        <label>Zoom <input id="zoom" type="range" min="20" max="100" step="5" value="50" /></label>
        <button id="save" type="button" class="primary">Salva stage</button>
        <button id="publish" type="button" class="publish">Salva e pubblica</button>
        <span id="dirty-state">Caricamento…</span>
      </header>

      <main class="workspace">
        <aside class="panel library-panel">
          <h2>Libreria</h2>
          <input id="asset-search" type="search" placeholder="Cerca oggetto…" />
          <select id="asset-category" aria-label="Categoria asset"><option value="">Tutte le categorie</option></select>
          <p class="hint">Trascina un asset nello stage oppure fai doppio clic per inserirlo al centro della vista.</p>
          <div id="asset-list" class="asset-list"></div>
        </aside>

        <section id="stage-scroll" class="stage-scroll" aria-label="Canvas dello stage">
          <div id="stage-viewport" class="stage-viewport">
            <div id="stage-canvas" class="stage-canvas" tabindex="0">
              <div id="background-layer" class="background-layer"></div>
              <svg id="walk-guides" class="walk-guides" preserveAspectRatio="none"></svg>
              <div id="ambient-layer" class="ambient-layer"></div>
              <div id="camera-guide" class="camera-guide"><span>CAMERA 1280 × 720</span></div>
              <div id="scale-reference" class="scale-reference"><span>MERCO<br />290 px</span></div>
            </div>
          </div>
        </section>

        <aside class="panel inspector-panel">
          <h2>Oggetto</h2>
          <div id="empty-inspector" class="empty">Seleziona un oggetto nello stage.</div>
          <form id="inspector" hidden>
            <label>ID <input id="object-id" type="text" readonly /></label>
            <label>Asset <input id="object-asset" type="text" readonly /></label>
            <div class="field-row">
              <label>X <input id="object-x" type="number" step="1" /></label>
              <label>Y <input id="object-y" type="number" step="1" /></label>
            </div>
            <div class="field-row">
              <label>Larghezza <input id="object-width" type="number" min="1" step="1" /></label>
              <label>Altezza <input id="object-height" type="number" min="1" step="1" /></label>
            </div>
            <label>Trasparenza <input id="object-alpha" type="range" min="0.1" max="1" step="0.01" /></label>
            <label class="check"><input id="object-flip" type="checkbox" /> Rivolgi verso l’altro lato</label>
            <div class="button-grid">
              <button id="duplicate" type="button">Duplica</button>
              <button id="delete" type="button" class="danger">Elimina</button>
            </div>
            <p class="hint">Frecce: 1 px · Shift+frecce: 10 px · trascina l’angolo per scalare.</p>
          </form>
          <section class="module-info">
            <h2>Modulo</h2>
            <dl id="module-info"></dl>
          </section>
        </aside>
      </main>
      <div id="toast" class="toast" role="status"></div>
    </div>
    <script type="module" src="/src/tools/stageEditor.ts"></script>
  </body>
</html>
